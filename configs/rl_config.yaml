rl:
  algorithm: "DQN"
  state_dim: 18
  action_dim: 6
  max_steps_per_episode: 4
  gamma: 0.99
  learning_rate: 0.0005
  batch_size: 32
  replay_buffer_capacity: 10000
  target_update_interval: 100
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995

rewards:
  r_correct: 1.0
  r_abstain: 0.0
  c_token: 0.2
  token_budget_ref: 2000
  c_step: 0.01
  lambda_min: 0.25
  lambda_max: 5.0
  lambda_default: 1.0

